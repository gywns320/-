<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毎日 일본어 | JLPT</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1c2940;font:16px/1.6 system-ui,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;color:inherit;background:#edf0f6}button:focus-visible{outline:3px solid #f1ad48}button.active,.primary{background:#244d76;color:white}header{background:white;border-bottom:1px solid #e1e6ed;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}header span{color:#60728a}main{max-width:1050px;margin:auto;padding:26px 20px}.hero{background:#203e59;color:white;border-radius:24px;padding:30px;position:relative;overflow:hidden}.hero p{color:#d5e4ef}.hero h1{margin:0;font-size:32px}.hero:after{content:'毎日';position:absolute;right:24px;bottom:-40px;font-size:140px;opacity:.08;pointer-events:none}.levels,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.levels button{flex:1;min-width:65px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:24px;margin-bottom:16px}.meta{color:#6b7c90;font-size:14px}.jp{font-size:30px;font-weight:700}ruby rt{font-size:.47em;font-weight:400}h2,h3{margin:0 0 12px}.entry{border-top:1px solid #e8edf2;padding:18px 0}.entry:first-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:10px;border-radius:10px;background:#e5ebf3;overflow:hidden}.fill{height:100%;background:#429d83}.choice{display:block;text-align:left;width:100%;margin:8px 0}.correct{background:#d8f4e5}.incorrect{background:#ffe0df}.small{font-size:14px}footer{color:#64748b;text-align:center;padding:20px}a{color:#31668e} @media(max-width:680px){.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.card{padding:18px}header span{font-size:13px}}
</style></head><body><header><strong>毎日 <span>일본어</span></strong><span>JLPT DAILY STUDY</span></header><main><section class="hero"><p id="date"></p><h1>하루 한 걸음, 일본어 실력은 매일.</h1><p>나에게 맞는 급수로 오늘의 어휘 · 문법 · 독해를 학습하세요.</p><button class="primary" style="background:#fff;color:#203e59" onclick="tab('words')">오늘 학습 시작</button></section><div class="levels" id="levels"></div><div class="grid"><section><div class="tabs" id="tabs"></div><div class="card" id="lesson"></div></section><aside><div class="card"><h3>오늘의 학습</h3><p id="stats"></p><div class="progress"><div class="fill" id="fill"></div></div><p class="meta" id="streak"></p></div><div class="card"><h3>학습 날짜</h3><div class="row"><button onclick="move(-1)">이전</button><b id="day"></b><button onclick="move(1)">다음</button></div><p class="meta">7일 분량의 기초 학습 세트를 순환합니다.</p></div><div class="card"><h3>시험 안내</h3><p class="meta">학습자료는 자체 제작 예시이며 JLPT 공식 출제 목록이 아닙니다.</p><a href="https://www.jlpt.jp/" target="_blank" rel="noopener">JLPT 공식 홈페이지</a></div></aside></div></main><footer>毎日 日本語 · 나만의 일본어 학습 루틴</footer><script>
const raw={
N5:'学校|がっこう|학교;食べる|たべる|먹다;水|みず|물;明日|あした|내일;友達|ともだち|친구;駅|えき|역;安い|やすい|싸다;見る|みる|보다;時間|じかん|시간;先生|せんせい|선생님;行く|いく|가다;買う|かう|사다;本|ほん|책;朝|あさ|아침',
N4:'経験|けいけん|경험;準備|じゅんび|준비;予約|よやく|예약;説明|せつめい|설명;急ぐ|いそぐ|서두르다;間に合う|まにあう|시간에 맞다;予定|よてい|예정;安心|あんしん|안심;続ける|つづける|계속하다;必要|ひつよう|필요;決める|きめる|결정하다;伝える|つたえる|전하다;相談|そうだん|상담;習慣|しゅうかん|습관',
N3:'確認|かくにん|확인;改善|かいぜん|개선;状況|じょうきょう|상황;影響|えいきょう|영향;判断|はんだん|판단;対応|たいおう|대응;提案|ていあん|제안;目標|もくひょう|목표;達成|たっせい|달성;工夫|くふう|궁리;解決|かいけつ|해결;負担|ふたん|부담;協力|きょうりょく|협력;比較|ひかく|비교',
N2:'把握|はあく|파악;促進|そくしん|촉진;維持|いじ|유지;傾向|けいこう|경향;充実|じゅうじつ|충실;妥当|だとう|타당;克服|こくふく|극복;貢献|こうけん|기여;見直す|みなおす|재검토하다;伴う|ともなう|수반하다;確保|かくほ|확보;課題|かだい|과제;柔軟|じゅうなん|유연;円滑|えんかつ|원활',
N1:'懸念|けねん|우려;是正|ぜせい|시정;齟齬|そご|불일치;弊害|へいがい|폐해;顕著|けんちょ|현저;踏襲|とうしゅう|답습;緩和|かんわ|완화;抜本的|ばっぽんてき|근본적;普及|ふきゅう|보급;模索|もさく|모색;勘案|かんあん|감안;遂行|すいこう|수행;乖離|かいり|괴리;堅実|けんじつ|착실'};
const grammar={N5:['〜たい|~하고 싶다|日本へ行きたいです。','〜ませんか|~하지 않겠습니까?|一緒に行きませんか。','〜てください|~해 주세요|本を読んでください。','〜から|~이므로|寒いから帰ります。','〜ましょう|~합시다|勉強しましょう。','〜が好き|~을 좋아하다|猫が好きです。','〜があります|~이 있습니다|時間があります。'],N4:['〜つもり|~할 생각|明日行くつもりです。','〜ながら|~하면서|音楽を聞きながら勉強します。','〜ようになる|~하게 되다|読めるようになった。','〜たことがある|~한 적이 있다|日本へ行ったことがある。','〜ほうがいい|~하는 편이 좋다|休んだほうがいい。','〜そうだ|~할 것 같다|雨が降りそうだ。','〜ために|~하기 위해|試験のために勉強する。'],N3:['〜わけではない|~인 것은 아니다|嫌いなわけではない。','〜に違いない|~임에 틀림없다|成功するに違いない。','〜おかげで|~덕분에|先生のおかげで合格した。','〜に対して|~에 대하여|質問に対して答える。','〜ほど|~할 정도로|驚くほど難しい。','〜ことになっている|~하기로 되어 있다|来月始まることになっている。','〜ばかりでなく|~뿐 아니라|日本語ばかりでなく英語も学ぶ。'],N2:['〜に伴って|~에 따라|人口の増加に伴って需要が増える。','〜にもかかわらず|~임에도 불구하고|雨にもかかわらず出かけた。','〜に基づいて|~에 근거하여|資料に基づいて判断する。','〜ざるを得ない|~하지 않을 수 없다|延期せざるを得ない。','〜に限らず|~에 한하지 않고|学生に限らず参加できる。','〜かねない|~할 우려가 있다|事故につながりかねない。','〜に応じて|~에 맞춰|状況に応じて対応する。'],N1:['〜を余儀なくされる|~을 강요받다|計画の変更を余儀なくされた。','〜に足る|~할 만하다|信頼に足る情報だ。','〜をもって|~로써|本日をもって終了する。','〜までもない|~할 필요도 없다|説明するまでもない。','〜いかんによって|~여하에 따라|結果いかんによって方針を決める。','〜と相まって|~와 맞물려|努力と才能が相まって成功した。','〜に堪えない|~을 견딜 수 없다|見るに堪えない光景だ。']};
const all=Object.fromEntries(Object.entries(raw).map(([k,v])=>[k,v.split(';').map(x=>x.split('|'))]));let level=localStorage.getItem('level')||'N2',view='words',offset=0;let saved=JSON.parse(localStorage.getItem('mainichi')||'{}');const today=new Date();const fmt=d=>d.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});const current=()=>{let d=new Date(today);d.setDate(d.getDate()+offset);return fmt(d)};const index=()=>((Math.floor(Date.parse(current())/86400000)%7)+7)%7;const key=()=>current()+level;const record=()=>saved[key()]||(saved[key()]={known:[],answers:{},grammar:false,reading:false});const persist=()=>{localStorage.setItem('mainichi',JSON.stringify(saved));render()};const words=()=>all[level].slice(index()*2,index()*2+2);const g=()=>grammar[level][index()].split('|');const tabs={words:'어휘·한자',grammar:'문법',reading:'독해',quiz:'실전 문제',review:'오답·단어장'};function tab(v){view=v;render()}function move(n){offset+=n;render()}function select(l){level=l;localStorage.setItem('level',l);render()}function known(w){let r=record();r.known=r.known.includes(w)?r.known.filter(x=>x!==w):[...r.known,w];persist()}function answer(i,j){record().answers[i]=j;persist()}function speak(s){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';speechSynthesis.speak(u)}}function mark(k){record()[k]=true;persist()}function ruby(w){return '<ruby>'+w[0]+'<rt>'+w[1]+'</rt></ruby>'}
function render(){let r=record(),ws=words(),gr=g();document.getElementById('date').textContent=current()+' · 今日の勉強';document.getElementById('day').textContent=current().slice(5);document.getElementById('levels').innerHTML=Object.keys(all).map(l=>'<button class="'+(l===level?'active':'')+'" onclick="select(\''+l+'\')">'+l+'</button>').join('');document.getElementById('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>'<button class="'+(view===k?'active':'')+'" onclick="tab(\''+k+'\')">'+v+'</button>').join('');let done=ws.filter(w=>r.known.includes(w[0])).length+Number(r.grammar)+Number(r.reading)+Object.keys(r.answers).length;document.getElementById('stats').textContent=done+' / 6 학습 완료';document.getElementById('fill').style.width=Math.min(100,done/6*100)+'%';document.getElementById('streak').textContent='학습한 날짜 '+new Set(Object.keys(saved).filter(k=>{let x=saved[k];return x.known.length||x.grammar||x.reading||Object.keys(x.answers).length}).map(k=>k.slice(0,10))).size+'일';let html='<div class="meta">'+level+' · DAY '+(index()+1)+'</div><h2>'+tabs[view]+'</h2>';if(view==='words'){html+=ws.map(w=>'<div class="entry"><div class="row"><div class="jp">'+ruby(w)+'</div><button onclick="speak(\''+w[0]+'\')">발음</button></div><p>'+w[2]+'</p><button class="'+(r.known.includes(w[0])?'active':'')+'" onclick="known(\''+w[0]+'\')">'+(r.known.includes(w[0])?'✓ 암기 완료':'암기하기')+'</button></div>').join('')}else if(view==='grammar'){html+='<div class="jp">'+gr[0]+'</div><p>'+gr[1]+'</p><div class="entry">'+gr[2]+'</div><button class="primary" onclick="mark(\'grammar\')">'+(r.grammar?'✓ 학습 완료':'학습 완료')+'</button>'}else if(view==='reading'){html+='<p class="jp" style="font-size:23px">'+gr[2]+'</p><p>문장의 핵심 표현을 찾고 한국어로 의미를 해석해 보세요.</p><details><summary>해석 힌트</summary><p>'+gr[0]+'：'+gr[1]+'</p></details><p><button class="primary" onclick="mark(\'reading\')">'+(r.reading?'✓ 학습 완료':'학습 완료')+'</button></p>'}else if(view==='quiz'){html+=ws.map((w,i)=>{let opts=[w,...all[level].filter(x=>x!==w).slice(0,3)];let shift=(index()+i)%4;opts=opts.slice(shift).concat(opts.slice(0,shift));let picked=r.answers[i];return '<div class="entry"><h3>'+ruby(w)+'의 뜻은?</h3>'+opts.map(o=>'<button class="choice '+(picked!==undefined?(o===w?'correct':picked===o[0]?'incorrect':''):'')+'" onclick="answer('+i+',\''+o[0]+'\')">'+o[2]+'</button>').join('')+(picked!==undefined?'<p>정답: '+w[2]+'</p>':'')+'</div>'}).join('')}else{let items=Object.entries(saved).filter(([k])=>k.endsWith(level));let wrong=[];let memorized=new Set();items.forEach(([k,x])=>{x.known.forEach(w=>memorized.add(w));let idx=((Math.floor(Date.parse(k.slice(0,10))/86400000)%7)+7)%7;Object.entries(x.answers).forEach(([i,a])=>{let w=all[level][idx*2+Number(i)];if(w&&a!==w[0])wrong.push(w)})});html+='<h3>암기 단어</h3>'+([...memorized].map(s=>all[level].find(w=>w[0]===s)).filter(Boolean).map(w=>'<p>'+ruby(w)+' · '+w[2]+'</p>').join('')||'<p>아직 암기한 단어가 없습니다.</p>')+'<h3>오답 복습</h3>'+(wrong.map(w=>'<p>'+ruby(w)+' · '+w[2]+'</p>').join('')||'<p>아직 오답이 없습니다.</p>')}document.getElementById('lesson').innerHTML=html}render();
</script></body></html>
